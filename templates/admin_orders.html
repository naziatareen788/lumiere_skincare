<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Orders — Lumière</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body style="background:#f8fbf5;">

<nav class="navbar">
    <div class="nav-logo">Lumière Admin</div>
    <div class="nav-links">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/orders">Orders</a>
        <a href="/admin/users">Users</a>
        <a href="/">View Website</a>
    </div>
    <div class="nav-icons">
        <a href="/admin/logout" class="nav-logout">Logout</a>
    </div>
</nav>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="flash-msg {{ category }}" style="margin:16px 32px;">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}
